<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube SRT Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container { max-width: 800px; width: 100%; }
        h1 { text-align: center; margin-bottom: 20px; color: #FFD700; font-size: 24px; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #FFD700; }
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            aspect-ratio: 16/9;
        }
        #player {
            width: 100%;
            height: 100%;
            border: none;
        }
        .subtitle-overlay {
            position: absolute;
            bottom: 80px;
            left: 0;
            right: 0;
            text-align: center;
            padding: 0 20px;
            pointer-events: none;
            z-index: 10;
        }
        .subtitle-overlay .subtitle-text {
            display: inline-block;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: clamp(18px, 4vw, 32px);
            font-weight: 700;
            color: #FFD700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            line-height: 1.4;
            max-width: 90%;
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        .controls button {
            padding: 8px 16px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 13px;
        }
        .controls button:hover { background: #2a2a2a; }
        .status {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
            min-height: 24px;
        }
        .status.loading { color: #FFD700; }
        .status.error { color: #ff4444; }
        .status.success { color: #00ff88; }
        @media (max-width: 600px) {
            .input-group { flex-direction: column; }
            .controls { gap: 6px; }
            .controls button { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 YouTube SRT Player</h1>
        <div class="input-group">
            <input type="text" id="videoIdInput" placeholder="Enter YouTube Video ID" value="dQw4w9WgXcQ">
            <button id="loadBtn">▶ Load Video</button>
        </div>
        <div id="status" class="status">Enter a YouTube video ID to start</div>
        <div class="player-wrapper">
            <iframe id="player" src="" allow="autoplay; encrypted-media; fullscreen"></iframe>
            <div class="subtitle-overlay">
                <div id="subtitleDisplay" class="subtitle-text"></div>
            </div>
        </div>
        <div class="controls">
            <button onclick="seekVideo(-5)">⏪ -5s</button>
            <button id="playBtn" onclick="togglePlay()">⏸ Pause</button>
            <button onclick="seekVideo(5)">⏩ +5s</button>
            <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>
    </div>
    <script>
        let currentTime = 0;
        let isPlaying = true;
        let subtitles = [];
        let pollInterval = null;
        const player = document.getElementById('player');
        
        document.getElementById('loadBtn').addEventListener('click', loadVideo);
        document.getElementById('videoIdInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadVideo();
        });
        
        async function loadVideo() {
            const videoId = document.getElementById('videoIdInput').value.trim();
            if (!videoId) {
                setStatus('Please enter a video ID', 'error');
                return;
            }
            
            setStatus('Loading video...', 'loading');
            document.getElementById('loadBtn').disabled = true;
            
            try {
                player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1&rel=0&enablejsapi=1`;
                
                const response = await fetch(`/api/video/${videoId}`);
                const data = await response.json();
                
                if (data.success) {
                    if (data.subtitles && data.subtitles.length > 0) {
                        subtitles = parseSRT(data.subtitles);
                        setStatus(`✅ Loaded: ${data.title} (${subtitles.length} subtitles)`, 'success');
                    } else {
                        subtitles = [];
                        setStatus(`✅ Loaded: ${data.title} (No subtitles)`, 'success');
                    }
                } else {
                    setStatus('❌ Failed to load video data', 'error');
                }
            } catch (error) {
                setStatus('❌ Error: ' + error.message, 'error');
            }
            
            document.getElementById('loadBtn').disabled = false;
            
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(pollSubtitles, 500);
        }
        
        function pollSubtitles() {
            if (isPlaying) currentTime += 0.5;
            
            let currentText = '';
            for (let sub of subtitles) {
                if (currentTime >= sub.start && currentTime <= sub.end) {
                    currentText = sub.text;
                    break;
                }
            }
            document.getElementById('subtitleDisplay').textContent = currentText;
        }
        
        function parseSRT(srtText) {
            if (!srtText) return [];
            const lines = srtText.split('\n');
            const subtitles = [];
            let i = 0;
            while (i < lines.length) {
                const line = lines[i].trim();
                if (!line) { i++; continue; }
                const num = parseInt(line);
                if (!isNaN(num)) {
                    i++;
                    const timeMatch = lines[i].match(/(\d{2}:\d{2}:\d{2},\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2},\d{3})/);
                    if (timeMatch) {
                        const start = toSeconds(timeMatch[1]);
                        const end = toSeconds(timeMatch[2]);
                        i++;
                        let text = '';
                        while (i < lines.length && lines[i].trim()) {
                            text += lines[i].trim() + ' ';
                            i++;
                        }
                        subtitles.push({ start, end, text: text.trim() });
                    }
                }
                i++;
            }
            return subtitles;
        }
        
        function toSeconds(timeStr) {
            const parts = timeStr.replace(',', '.').split(':');
            return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseFloat(parts[2]);
        }
        
        window.togglePlay = function() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').textContent = isPlaying ? '⏸ Pause' : '▶ Play';
            const command = isPlaying ? 'playVideo' : 'pauseVideo';
            player.contentWindow.postMessage(JSON.stringify({ event: 'command', func: command, args: '' }), '*');
        };
        
        window.seekVideo = function(seconds) {
            currentTime += seconds;
            if (currentTime < 0) currentTime = 0;
            player.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'seekTo', args: [currentTime, true] }), '*');
        };
        
        window.toggleFullscreen = function() {
            const wrapper = document.querySelector('.player-wrapper');
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        };
        
        function setStatus(message, type = '') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status' + (type ? ' ' + type : '');
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
            if (e.key === 'ArrowRight') { e.preventDefault(); seekVideo(5); }
            if (e.key === 'ArrowLeft') { e.preventDefault(); seekVideo(-5); }
            if (e.key === 'f') { e.preventDefault(); toggleFullscreen(); }
        });
    </script>
</body>
</html>
