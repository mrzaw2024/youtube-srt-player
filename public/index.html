<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dubai 2D Forecast</title>
    <style>
        /* ===== GLOBAL ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0b0c10 0%, #1a1a2e 100%);
            color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }
        ::-webkit-scrollbar { width: 0; height: 0; }

        /* ===== CONTAINER ===== */
        .container {
            width: 100%;
            max-width: 820px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            color: #2c3e50;
        }

        /* ===== HEADER ===== */
        .header-area {
            text-align: center;
            margin-bottom: 20px;
        }
        .header-area h2 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub-status-area {
            font-size: 13px;
            color: #57606f;
            font-weight: 700;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .status-icon { font-size: 18px; }
        .view-count-num { color: #f5576c; font-weight: 800; }

        /* ===== TABLE ===== */
        .table-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #2c3e50;
            border-left: 4px solid #f5576c;
            padding-left: 8px;
        }
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #dcdde1;
            background: #ffffff;
            margin-bottom: 16px;
        }
        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            font-size: 13px;
            text-align: center;
        }
        th {
            background: linear-gradient(180deg, #e17055 0%, #d63031 100%);
            color: #ffffff;
            font-weight: 700;
            padding: 14px 4px;
            font-size: 12px;
        }
        td {
            border-bottom: 1px solid #dee2e6;
            border-right: 1px solid #eef0f2;
            padding: 12px 6px;
            color: #2f3542;
            font-weight: 600;
            vertical-align: middle;
        }
        td:last-child { border-right: none; }
        tr:nth-child(even) td { background-color: #f9fbfd; }

        /* ===== NUMBER BOX ===== */
        .num-box-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .num-box {
            display: inline-block;
            width: 90%;
            max-width: 55px;
            font-weight: 800;
            font-size: 14px;
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            padding: 7px 0;
            border-radius: 10px;
            border: 1px solid #fdcb6e;
            text-align: center;
        }

        /* ===== GREEN HIGHLIGHT (ONLY FOR MATCHING) ===== */
        .highlight-match {
            background: linear-gradient(135deg, #a8e6cf 0%, #2ecc71 100%) !important;
        }
        .highlight-match .num-box {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white;
            border-color: #00cec9;
            box-shadow: 0 3px 10px rgba(0, 206, 201, 0.3);
        }

        /* ===== KHAWAY COLUMN ===== */
        .khaway-col {
            font-weight: 700;
            color: #2c3e50;
            min-width: 100px;
        }
        .khaway-box {
            display: inline-block;
            background: #e8f0fe;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid #d2e3fc;
            font-size: 12px;
            font-weight: 700;
            color: #2c3e50;
            margin: 2px;
        }
        .khaway-box.hit {
            background: #2ecc71;
            color: white;
            border-color: #27ae60;
        }

        /* ===== RESULT ROW ===== */
        .result-row td {
            background: #f8f9fa !important;
        }
        .result-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
        }
        .result-badge.hit {
            background: #2ecc71;
            color: white;
        }
        .result-badge.miss {
            background: #e74c3c;
            color: white;
        }
        .result-badge.waiting {
            background: #f39c12;
            color: white;
        }

        /* ===== EMPTY STATUS ===== */
        .empty-status {
            color: #57606f;
            padding: 30px !important;
            font-weight: 700;
        }

        /* ===== ADMIN FOOTER ===== */
        .admin-footer-box {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #57606f;
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 16px;
            border-radius: 14px;
            border: 1px solid rgba(0,0,0,0.05);
            display: inline-block;
        }
        .admin-link {
            color: #f5576c;
            text-decoration: none;
            font-weight: 800;
        }
        .flex-center {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        /* ===== 7 COLUMNS LAYOUT ===== */
        table th,
        table td {
            width: 14.28% !important;
        }
        .khaway-col-header {
            background: linear-gradient(180deg, #6c5ce7 0%, #6c5ce7 100%) !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <h2>🇦🇪 Dubai 2D ခန့်မှန်းချက်</h2>
        <div class="sub-status-area">
            <span class="status-icon" id="dubaiStatusIcon">🔄</span>
            <span>👁️ ကြည့်ရှုသူအရေအတွက်: <span class="view-count-num" id="dubaiViewCount">0</span> views</span>
        </div>
    </div>

    <div class="table-title">📊 ၆ ကွက် ထွက်ဂဏန်း + အခွေပူး ဇယား</div>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>၁၁ နာရီ</th>
                    <th>၁ နာရီ</th>
                    <th>၃ နာရီ</th>
                    <th>၅ နာရီ</th>
                    <th>၇ နာရီ</th>
                    <th>၉ နာရီ</th>
                    <th class="khaway-col-header">🎯 ထိုးရမဲ့ဂဏန်း<br>အခွေပူး</th>
                </tr>
            </thead>
            <tbody id="dubaiTableBody">
                <tr>
                    <td colspan="7" class="empty-status">ဒေတာများ ဆွဲယူနေပါသည်...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="flex-center">
        <div class="admin-footer-box">
            👨‍✈️ Admin Telegram: <a href="https://t.me/luckylay01" target="_blank" class="admin-link">@luckylay01</a>
        </div>
    </div>
</div>

<script>
    // ==================== DUBAI 2D SECTION ====================
    const DUBAI_SHEET_ID = '1ICqRfe1aMsRmvjyfcaKFnqplubIyO3Xfe4JYgQRZP5E';
    const DUBAI_SHEET_URL = `https://docs.google.com/spreadsheets/d/${DUBAI_SHEET_ID}/gviz/tq?tqx=out:csv`;

    let dubaiResults = [];
    let dubaiKhwayItems = [];

    // ==================== VIEW COUNTER ====================
    function handleDubaiViewCounter() {
        const COUNTER_KEY = 'dubai2d_vercel_app_2026_views';
        fetch(`https://countapi.mileshilliard.com/api/v1/hit/${COUNTER_KEY}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('dubaiViewCount').innerText = Number(data.value).toLocaleString();
            })
            .catch(error => {
                document.getElementById('dubaiViewCount').innerText = '-';
            });
    }

    // ==================== FETCH DATA ====================
    function fetchDubaiData() {
        const noCacheUrl = `${DUBAI_SHEET_URL}&_ts=${Date.now()}`;
        fetch(noCacheUrl, { cache: 'no-store' })
            .then(response => response.text())
            .then(data => {
                parseDubaiCSV(data);
                document.getElementById('dubaiStatusIcon').innerText = '✅';
                renderDubaiTable();
            })
            .catch(error => {
                console.error('Error fetching Dubai data:', error);
                document.getElementById('dubaiStatusIcon').innerText = '❌';
            });
    }

    // ==================== PARSE CSV ====================
    function parseDubaiCSV(csvText) {
        let lines = csvText.split('\n');
        dubaiResults = [];
        dubaiKhwayItems = [];

        for (let i = 1; i < lines.length; i++) {
            let currentLine = lines[i].trim();
            if (!currentLine) continue;

            let matches = currentLine.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || currentLine.split(',');
            
            if (matches.length >= 1) {
                let res = matches[0].replace(/"/g, '').trim();
                
                let khw = '';
                if (matches.length > 1) {
                    let textParts = [];
                    for(let j=1; j<matches.length; j++) {
                        let part = matches[j].replace(/"/g, '').trim();
                        if(part) textParts.push(part);
                    }
                    khw = textParts.join(',').trim();
                }

                if (res === 'ထွက်ဂဏန်း' || res === 'results' || res === 'အခွေပူး' || res === 'khways') continue;

                // Dubai format: 12-digit number split into 6 pairs
                if (res.length === 12) {
                    const pairs = [];
                    for (let i = 0; i < 12; i += 2) {
                        pairs.push(res.substring(i, i + 2));
                    }
                    // Reorder to [11,1,3,5,7,9]
                    if (pairs.length === 6) {
                        dubaiResults.push([
                            pairs[5], // 11
                            pairs[0], // 1
                            pairs[1], // 3
                            pairs[2], // 5
                            pairs[3], // 7
                            pairs[4]  // 9
                        ]);
                        dubaiKhwayItems.push(khw || '-');
                    }
                } else if (res.length === 2) {
                    if (!Array.isArray(dubaiResults[dubaiResults.length - 1])) {
                        dubaiResults.push([res]);
                        dubaiKhwayItems.push(khw || '-');
                    } else {
                        dubaiResults[dubaiResults.length - 1].push(res);
                    }
                } else if (res.length === 4) {
                    const pair1 = res.substring(0, 2);
                    const pair2 = res.substring(2, 4);
                    if (!Array.isArray(dubaiResults[dubaiResults.length - 1]) || dubaiResults[dubaiResults.length - 1].length >= 6) {
                        dubaiResults.push([pair1, pair2]);
                        dubaiKhwayItems.push(khw || '-');
                    } else {
                        dubaiResults[dubaiResults.length - 1].push(pair1, pair2);
                    }
                }
            }
        }

        // Ensure each row has exactly 6 columns
        for (let i = 0; i < dubaiResults.length; i++) {
            if (Array.isArray(dubaiResults[i])) {
                while (dubaiResults[i].length < 6) {
                    dubaiResults[i].push('-');
                }
            }
        }
    }

    // ==================== CHECK MATCH LOGIC ====================
    function checkMatchLogic(khwayItem, target2D) {
        let cleanKhway = khwayItem.replace(/[^\d]/g, '').trim();
        if (!cleanKhway) return false;

        if (cleanKhway.length === 1) {
            return target2D.includes(cleanKhway);
        } else if (cleanKhway.length === 2) {
            return (cleanKhway === target2D);
        } else {
            let digitsArray = cleanKhway.split('');
            return (digitsArray.includes(target2D[0]) && digitsArray.includes(target2D[1]));
        }
    }

    // ==================== RENDER TABLE ====================
    function renderDubaiTable() {
        let tbody = document.getElementById('dubaiTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';

        if(dubaiResults.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="empty-status">ဒေတာများ မရှိသေးပါ။ Google Sheet တွင် အရင်ဖြည့်ပါ။</td></tr>`;
            return;
        }

        for (let rowIndex = 0; rowIndex < dubaiResults.length; rowIndex++) {
            const row = dubaiResults[rowIndex];
            const khwayStr = dubaiKhwayItems[rowIndex] || '';
            
            // ===== ROW 1: Number Row =====
            const tr1 = document.createElement('tr');
            
            // Check which columns match with khaway
            const matchResults = [];
            for (let col = 0; col < 6; col++) {
                const val = row[col] || '-';
                const isMatch = khwayStr && khwayStr !== '-' && checkMatchLogic(khwayStr, val);
                matchResults.push(isMatch && val !== '-');
            }
            
            for (let col = 0; col < 6; col++) {
                const td = document.createElement('td');
                const val = row[col] || '-';
                const displayVal = val === '-' ? '-' : val;
                
                // Only highlight if this column matches
                if (matchResults[col]) {
                    td.className = 'highlight-match';
                }
                
                td.innerHTML = `<div class="num-box-wrapper"><span class="num-box">${displayVal}</span></div>`;
                tr1.appendChild(td);
            }
            
            // Khaway column (7th column) - show the khaway numbers
            const tdKhway = document.createElement('td');
            tdKhway.className = 'khaway-col';
            if (khwayStr && khwayStr !== '-') {
                const khwayParts = khwayStr.split(/[\/,]+/).map(s => s.trim()).filter(s => s.length > 0);
                let khwayHTML = '';
                khwayParts.forEach((kh, idx) => {
                    // Check if this khaway matches any number in the row
                    const isHit = row.some(val => val !== '-' && checkMatchLogic(kh, val));
                    khwayHTML += `<span class="khaway-box ${isHit ? 'hit' : ''}">${kh}</span>`;
                    if (idx < khwayParts.length - 1) khwayHTML += ' ';
                });
                tdKhway.innerHTML = khwayHTML;
            } else {
                tdKhway.innerHTML = `<span style="color:#bdc3c7;font-size:11px;">မရှိ</span>`;
            }
            tr1.appendChild(tdKhway);
            tbody.appendChild(tr1);

            // ===== ROW 2: Result Row (check next row) =====
            const tr2 = document.createElement('tr');
            tr2.className = 'result-row';
            const nextRowIndex = rowIndex + 1;
            
            for (let col = 0; col < 6; col++) {
                const td = document.createElement('td');
                
                if (nextRowIndex < dubaiResults.length && khwayStr && khwayStr !== '-') {
                    const nextRow = dubaiResults[nextRowIndex];
                    const nextVal = nextRow[col] || '-';
                    const isMatch = checkMatchLogic(khwayStr, nextVal);
                    
                    if (isMatch && nextVal !== '-') {
                        td.innerHTML = `<span class="result-badge hit">✅ ${nextVal}</span>`;
                    } else if (isMatch && nextVal === '-') {
                        td.innerHTML = `<span class="result-badge waiting">⏳</span>`;
                    } else {
                        td.innerHTML = `<span class="result-badge miss">❌</span>`;
                    }
                } else if (nextRowIndex < dubaiResults.length) {
                    td.innerHTML = `<span style="color:#bdc3c7;font-size:11px;">-</span>`;
                } else {
                    td.innerHTML = `<span style="color:#bdc3c7;font-size:11px;">-</span>`;
                }
                
                tr2.appendChild(td);
            }
            
            // Result for khaway column - show overall hit
            const tdResultKhway = document.createElement('td');
            if (nextRowIndex < dubaiResults.length && khwayStr && khwayStr !== '-') {
                const nextRow = dubaiResults[nextRowIndex];
                let hasHit = false;
                let hitVal = '';
                let hitCount = 0;
                for (let col = 0; col < 6; col++) {
                    const nextVal = nextRow[col] || '-';
                    if (checkMatchLogic(khwayStr, nextVal) && nextVal !== '-') {
                        hasHit = true;
                        hitVal = nextVal;
                        hitCount++;
                        break;
                    }
                }
                if (hasHit) {
                    tdResultKhway.innerHTML = `<span class="result-badge hit">✅ ${hitVal} (${hitCount})</span>`;
                } else {
                    tdResultKhway.innerHTML = `<span class="result-badge miss">❌</span>`;
                }
            } else {
                tdResultKhway.innerHTML = `<span style="color:#bdc3c7;font-size:11px;">-</span>`;
            }
            tr2.appendChild(tdResultKhway);
            tbody.appendChild(tr2);
        }
    }

    // ==================== INIT ====================
    window.onload = function() {
        handleDubaiViewCounter();
        fetchDubaiData();
    };
</script>

</body>
</html>
