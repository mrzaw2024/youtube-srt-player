<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dubai 2D Forecast</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0b0c10 0%, #1a1a2e 100%);
            color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }
        ::-webkit-scrollbar { width: 0; height: 0; }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            color: #2c3e50;
        }

        .header-area {
            text-align: center;
            margin-bottom: 20px;
        }
        .header-area h2 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub-status-area {
            font-size: 13px;
            color: #57606f;
            font-weight: 700;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .status-icon { font-size: 18px; }
        .view-count-num { color: #f5576c; font-weight: 800; }

        .table-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #2c3e50;
            border-left: 4px solid #f5576c;
            padding-left: 8px;
        }
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            border-radius: 16px;
            border: 1px solid #dcdde1;
            background: #ffffff;
            margin-bottom: 16px;
        }
        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            font-size: 13px;
            text-align: center;
        }
        th {
            background: linear-gradient(180deg, #e17055 0%, #d63031 100%);
            color: #ffffff;
            font-weight: 700;
            padding: 12px 4px;
            font-size: 12px;
        }
        td {
            border-bottom: 1px solid #dee2e6;
            border-right: 1px solid #eef0f2;
            padding: 10px 4px;
            color: #2f3542;
            font-weight: 600;
            vertical-align: middle;
            word-wrap: break-word;
            word-break: break-word;
        }
        td:last-child { border-right: none; }
        tr:nth-child(even) td { background-color: #f9fbfd; }

        .num-box-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .num-box {
            display: inline-block;
            width: 90%;
            max-width: 55px;
            font-weight: 800;
            font-size: 14px;
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            padding: 6px 0;
            border-radius: 10px;
            border: 1px solid #fdcb6e;
            text-align: center;
        }

        .highlight-match {
            background: linear-gradient(135deg, #a8e6cf 0%, #2ecc71 100%) !important;
        }
        .highlight-match .num-box {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white;
            border-color: #00cec9;
            box-shadow: 0 3px 10px rgba(0, 206, 201, 0.3);
        }

        /* ===== PREDICTION ROW (TOP) ===== */
        .pred-row td {
            background: #fef9e7 !important;
            font-weight: 700;
            color: #2c3e50;
            padding: 10px 4px;
        }
        .pred-number {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #2c3e50;
            background: #e8f0fe;
            border: 1px solid #d2e3fc;
            margin: 2px;
            word-break: break-word;
        }
        .pred-number.hit {
            background: #2ecc71;
            color: white;
            border-color: #27ae60;
        }

        /* ===== KHAWAY COLUMN ===== */
        .khaway-col {
            font-weight: 700;
            color: #2c3e50;
            min-width: 120px;
        }
        .khaway-box {
            display: inline-block;
            background: #e8f0fe;
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid #d2e3fc;
            font-size: 12px;
            font-weight: 700;
            color: #2c3e50;
            margin: 2px;
            word-break: break-word;
        }
        .khaway-box.hit {
            background: #2ecc71;
            color: white;
            border-color: #27ae60;
        }
        .khaway-col-header {
            background: linear-gradient(180deg, #6c5ce7 0%, #6c5ce7 100%) !important;
        }

        .empty-status {
            color: #57606f;
            padding: 30px !important;
            font-weight: 700;
        }

        .admin-footer-box {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #57606f;
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 16px;
            border-radius: 14px;
            border: 1px solid rgba(0,0,0,0.05);
            display: inline-block;
        }
        .admin-link {
            color: #f5576c;
            text-decoration: none;
            font-weight: 800;
        }
        .flex-center {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        table th,
        table td {
            width: 14.28% !important;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container { padding: 12px; }
            .header-area h2 { font-size: 20px; }
            .num-box { max-width: 40px; font-size: 12px; padding: 4px 0; }
            .pred-number { font-size: 10px; padding: 2px 5px; }
            .khaway-box { font-size: 10px; padding: 2px 5px; }
            table { font-size: 10px; }
            th { font-size: 9px; padding: 8px 2px; }
            td { padding: 6px 2px; }
            .khaway-col { min-width: 80px; }
        }
        @media (max-width: 400px) {
            .num-box { max-width: 32px; font-size: 10px; }
            .pred-number { font-size: 9px; padding: 1px 3px; }
            .khaway-box { font-size: 9px; padding: 1px 3px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <h2>🇦🇪 Dubai 2D ခန့်မှန်းချက်</h2>
        <div class="sub-status-area">
            <span class="status-icon" id="dubaiStatusIcon">🔄</span>
            <span>👁️ ကြည့်ရှုသူအရေအတွက်: <span class="view-count-num" id="dubaiViewCount">0</span> views</span>
        </div>
    </div>

    <div class="table-title">📊 ၆ ကွက် ထွက်ဂဏန်း + ထိုးရမဲ့ဂဏန်း + အခွေပူး ဇယား</div>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>၁၁ နာရီ</th>
                    <th>၁ နာရီ</th>
                    <th>၃ နာရီ</th>
                    <th>၅ နာရီ</th>
                    <th>၇ နာရီ</th>
                    <th>၉ နာရီ</th>
                    <th class="khaway-col-header">🎯 အခွေပူး</th>
                </tr>
            </thead>
            <tbody id="dubaiTableBody">
                <tr>
                    <td colspan="7" class="empty-status">ဒေတာများ ဆွဲယူနေပါသည်...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="flex-center">
        <div class="admin-footer-box">
            👨‍✈️ Admin Telegram: <a href="https://t.me/luckylay01" target="_blank" class="admin-link">@luckylay01</a>
        </div>
    </div>
</div>

<script>
    const DUBAI_SHEET_ID = '1ICqRfe1aMsRmvjyfcaKFnqplubIyO3Xfe4JYgQRZP5E';
    const DUBAI_SHEET_URL = `https://docs.google.com/spreadsheets/d/${DUBAI_SHEET_ID}/gviz/tq?tqx=out:csv`;

    let dubaiResults = [];
    let dubaiKhwayItems = [];
    let dubaiHourlyPredictions = [];

    function handleDubaiViewCounter() {
        const COUNTER_KEY = 'dubai2d_vercel_app_2026_views';
        fetch(`https://countapi.mileshilliard.com/api/v1/hit/${COUNTER_KEY}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('dubaiViewCount').innerText = Number(data.value).toLocaleString();
            })
            .catch(() => {
                document.getElementById('dubaiViewCount').innerText = '-';
            });
    }

    function fetchDubaiData() {
        const noCacheUrl = `${DUBAI_SHEET_URL}&_ts=${Date.now()}`;
        fetch(noCacheUrl, { cache: 'no-store' })
            .then(response => response.text())
            .then(data => {
                parseDubaiCSV(data);
                document.getElementById('dubaiStatusIcon').innerText = '✅';
                renderDubaiTable();
            })
            .catch(() => {
                document.getElementById('dubaiStatusIcon').innerText = '❌';
            });
    }

    function parseDubaiCSV(csvText) {
        let lines = csvText.split('\n');
        dubaiResults = [];
        dubaiKhwayItems = [];
        dubaiHourlyPredictions = [];

        for (let i = 1; i < lines.length; i++) {
            let currentLine = lines[i].trim();
            if (!currentLine) continue;

            let matches = currentLine.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || currentLine.split(',');
            
            if (matches.length >= 1) {
                let res = matches[0].replace(/"/g, '').trim();
                if (res === 'ထွက်ဂဏန်း' || res === 'results' || res === 'အခွေပူး' || res === 'khways') continue;

                if (res.length === 12) {
                    const pairs = [];
                    for (let i = 0; i < 12; i += 2) {
                        pairs.push(res.substring(i, i + 2));
                    }
                    // FIX: pairs ကို ရရှိသည့်အစဉ်အတိုင်းပဲ တန်းစီပေးမည်
                    // (၁၁နာရီ, ၁နာရီ, ၃နာရီ, ၅နာရီ, ၇နာရီ, ၉နာရီ) column အစဉ်အတိုင်းနှင့် ကိုက်ညီစေရန်
                    // rotate မလုပ်တော့ပါ
                    if (pairs.length === 6) {
                        dubaiResults.push(pairs);
                    }
                }

                if (matches.length > 1) {
                    let khw = matches[1].replace(/"/g, '').trim();
                    dubaiKhwayItems.push(khw || '-');
                }

                if (matches.length > 2) {
                    let hourlyPreds = [];
                    for (let j = 2; j < Math.min(matches.length, 8); j++) {
                        let pred = matches[j].replace(/"/g, '').trim();
                        hourlyPreds.push(pred || '-');
                    }
                    while (hourlyPreds.length < 6) {
                        hourlyPreds.push('-');
                    }
                    dubaiHourlyPredictions.push(hourlyPreds);
                }
            }
        }

        while (dubaiHourlyPredictions.length < dubaiResults.length) {
            dubaiHourlyPredictions.push(['-', '-', '-', '-', '-', '-']);
        }
        while (dubaiKhwayItems.length < dubaiResults.length) {
            dubaiKhwayItems.push('-');
        }
    }

    function checkMatchLogic(khwayItem, target2D) {
        let cleanKhway = khwayItem.replace(/[^\d]/g, '').trim();
        if (!cleanKhway) return false;

        if (cleanKhway.length === 1) {
            return target2D.includes(cleanKhway);
        } else if (cleanKhway.length === 2) {
            return (cleanKhway === target2D);
        } else {
            let digitsArray = cleanKhway.split('');
            return (digitsArray.includes(target2D[0]) && digitsArray.includes(target2D[1]));
        }
    }

    function renderDubaiTable() {
        let tbody = document.getElementById('dubaiTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';

        if(dubaiResults.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="empty-status">ဒေတာများ မရှိသေးပါ။ Google Sheet တွင် အရင်ဖြည့်ပါ။</td></tr>`;
            return;
        }

        for (let rowIndex = 0; rowIndex < dubaiResults.length; rowIndex++) {
            const row = dubaiResults[rowIndex];
            const khwayStr = dubaiKhwayItems[rowIndex] || '-';
            const hourlyPreds = dubaiHourlyPredictions[rowIndex] || ['-', '-', '-', '-', '-', '-'];

            // ===== ROW 1: Prediction Row (TOP) =====
            const trPred = document.createElement('tr');
            trPred.className = 'pred-row';
            for (let col = 0; col < 6; col++) {
                const td = document.createElement('td');
                const predVal = hourlyPreds[col] || '-';
                
                let displayHtml = '';
                if (predVal !== '-') {
                    // Split by / and , and show each number separately
                    const predParts = predVal.split(/[\/,]+/).map(s => s.trim()).filter(s => s.length > 0);
                    let partsHtml = '';
                    predParts.forEach((p, idx) => {
                        // Check if this prediction matches the row value
                        const rowVal = row[col] || '-';
                        let isMatch = false;
                        if (rowVal !== '-') {
                            isMatch = checkMatchLogic(p, rowVal);
                        }
                        partsHtml += `<span class="pred-number ${isMatch ? 'hit' : ''}">${p}</span>`;
                        if (idx < predParts.length - 1) partsHtml += ' ';
                    });
                    displayHtml = partsHtml;
                } else {
                    displayHtml = `<span style="color:#bdc3c7;font-size:11px;">-</span>`;
                }
                td.innerHTML = displayHtml;
                trPred.appendChild(td);
            }
            // Khaway column prediction
            const tdPredKhway = document.createElement('td');
            tdPredKhway.className = 'khaway-col';
            if (khwayStr && khwayStr !== '-') {
                const khwayParts = khwayStr.split(/[\/,]+/).map(s => s.trim()).filter(s => s.length > 0);
                let hitKhways = [];
                khwayParts.forEach(kh => {
                    const isHit = row.some(val => val !== '-' && checkMatchLogic(kh, val));
                    if (isHit) hitKhways.push(kh);
                });
                if (hitKhways.length > 0) {
                    tdPredKhway.innerHTML = `<span class="khaway-box hit">✓ ${hitKhways.join(', ')}</span>`;
                } else {
                    tdPredKhway.innerHTML = `<span class="khaway-box">${khwayStr}</span>`;
                }
            } else {
                tdPredKhway.innerHTML = `<span style="color:#bdc3c7;font-size:11px;">-</span>`;
            }
            trPred.appendChild(tdPredKhway);
            tbody.appendChild(trPred);

            // ===== ROW 2: Number Row (BOTTOM) =====
            const trNum = document.createElement('tr');
            for (let col = 0; col < 6; col++) {
                const td = document.createElement('td');
                const val = row[col] || '-';
                const displayVal = val === '-' ? '-' : val;
                
                // Check if this number matches any prediction in the same column
                const predVal = hourlyPreds[col] || '-';
                let isMatch = false;
                if (predVal !== '-' && val !== '-') {
                    const predParts = predVal.split(/[\/,]+/).map(s => s.trim()).filter(s => s.length > 0);
                    for (let p of predParts) {
                        if (checkMatchLogic(p, val)) {
                            isMatch = true;
                            break;
                        }
                    }
                }
                
                if (isMatch) {
                    td.className = 'highlight-match';
                }
                
                td.innerHTML = `<div class="num-box-wrapper"><span class="num-box">${displayVal}</span></div>`;
                trNum.appendChild(td);
            }
            // Khaway column
            const tdKhway = document.createElement('td');
            tdKhway.className = 'khaway-col';
            if (khwayStr && khwayStr !== '-') {
                const khwayParts = khwayStr.split(/[\/,]+/).map(s => s.trim()).filter(s => s.length > 0);
                let khwayHTML = '';
                let anyMatch = false;
                khwayParts.forEach((kh, idx) => {
                    const isHit = row.some(val => val !== '-' && checkMatchLogic(kh, val));
                    if (isHit) anyMatch = true;
                    khwayHTML += `<span class="khaway-box ${isHit ? 'hit' : ''}">${kh}</span>`;
                    if (idx < khwayParts.length - 1) khwayHTML += ' ';
                });
                if (anyMatch) {
                    tdKhway.style.background = 'rgba(46, 204, 113, 0.15)';
                }
                tdKhway.innerHTML = khwayHTML;
            } else {
                tdKhway.innerHTML = `<span style="color:#bdc3c7;font-size:11px;">-</span>`;
            }
            trNum.appendChild(tdKhway);
            tbody.appendChild(trNum);
        }
    }

    window.onload = function() {
        handleDubaiViewCounter();
        fetchDubaiData();
    };
</script>

</body>
</html>
